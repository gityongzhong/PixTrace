[project]
name = "pixtrace"
version = "0.5.3"
description = "本地离线批量抠图：去背景、替换背景，全链路宽松许可（MIT）"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "onnxruntime>=1.20",
    "numpy>=1.26",
    "pillow>=10.0",
    "PySide6-Essentials>=6.8",
]

[project.scripts]
pixtrace = "cli:main"
pixtrace-gui = "app.main:main"

[tool.setuptools]
packages = ["app", "app.core", "app.batch", "app.infra", "app.ui"]
py-modules = ["cli"]
